  - aid: epcor:epcor-outages-arcgis
    name: EPCOR Public Outage and Service Area Feature Services (ArcGIS REST)
    description: >-
      EPCOR's undocumented but fully public geospatial data surface. Its outage
      map at outages.epcor.com loads its endpoints from a configuration file
      that points at a publicly shared ArcGIS Online organization
      (services6.arcgis.com/Ji2rusuWXDFSqNsP, item owner epcor_outages, access
      public). Thirty-six production feature services answer anonymous ArcGIS
      REST queries with live operational data: Edmonton active and planned power
      outage areas with incident number, cause, affected-customer count,
      neighbourhoods and street ranges; Canadian water outages and main breaks;
      generic water events and scheduled field events; water infrastructure
      capital projects with status, lifecycle and typed dates; and per-district
      outage points plus service-area boundaries for fourteen EPCOR Water USA
      districts in Arizona and New Mexico. No API key, no signup, no rate limit,
      no licence, no terms of use and no support channel are published for it,
      and EPCOR's own environment pipeline (dev/test/ist/uat copies) sits in the
      same public folder. Format is selected with an f parameter (json, geojson,
      pbf), paging uses resultOffset/resultRecordCount against a 2000-feature
      cap, and errors are returned with HTTP 200 and an Esri error body. The
      OpenAPI in this repo is derived by API Evangelist from live service and
      layer metadata - EPCOR publishes no specification.
    humanURL: https://outages.epcor.com/
    baseURL: https://services6.arcgis.com/Ji2rusuWXDFSqNsP/ArcGIS/rest/services
    tags:
