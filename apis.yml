name: EPCOR
kind: company
description: >-
  EPCOR Utilities Inc. is a municipally owned Canadian utility headquartered in
  Edmonton, Alberta, wholly owned by the City of Edmonton, that builds and
  operates electricity distribution and transmission, water and wastewater, and
  natural gas distribution systems across Alberta, Ontario and British Columbia
  in Canada and in Arizona, New Mexico and Texas in the United States. In its
  Alberta home market it is both a wires company for Edmonton and, through EPCOR
  Energy Alberta, a regulated-rate electricity retailer, sitting at the
  distribution-and-retail end of the value chain rather than in generation
  (generation was spun out as Capital Power in 2009). Its API posture is defined
  entirely by regulation and nothing else: epcor.com publishes no developer
  portal, no API documentation and no machine-readable contracts, and the
  developer., developers., api., docs. and data. subdomains do not resolve. The
  one programmatic consumer surface is the Green Button implementation its three
  Ontario service areas - natural gas in the Aylmer area and electricity in the
  Collingwood and Kincardine areas - are required to run under Ontario's energy
  data regulation (O. Reg. 633/21), delivered as Download My Data behind a
  customer login and Connect My Data behind a third-party vendor registration
  portal, with EPCOR stating Green Button Alliance certification. Its far larger
  unmandated Alberta business publishes no equivalent, and EPCOR publishes no
  open grid or market data of its own - Alberta system and market data comes
  from AESO, not from EPCOR. The result is a utility that is open exactly where
  a province compelled it and closed everywhere else, with consumer data gated
  and market data absent.
