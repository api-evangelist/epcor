aid: epcor
url: https://raw.githubusercontent.com/api-evangelist/epcor/refs/heads/main/apis.yml
name: EPCOR
kind: company
description: >-
  EPCOR Utilities Inc. is a municipally owned Canadian utility headquartered in
  Edmonton, Alberta, wholly owned by the City of Edmonton, that builds and
  operates electricity distribution and transmission, water and wastewater, and
  natural gas distribution systems across Alberta, Ontario and British Columbia
  in Canada and in Arizona, New Mexico and Texas in the United States. In its
  Alberta home market it is both a wires company for Edmonton and, through EPCOR
  Energy Alberta, a regulated-rate electricity retailer, sitting at the
  distribution-and-retail end of the value chain rather than in generation
  (generation was spun out as Capital Power in 2009). EPCOR runs no developer
  programme: epcor.com publishes no developer portal, no API documentation, no
  OpenAPI and no llms.txt, and the developer., developers., api., docs. and
  data. subdomains do not resolve. It nonetheless operates two real programmatic
  surfaces. The first is compelled: the Green Button Download My Data and
  Connect My Data service its three Ontario service areas - natural gas in the
  Aylmer area and electricity in the Collingwood and Kincardine areas - must run
  under Ontario's energy data regulation (O. Reg. 633/21), delivered behind a
  customer login and a third-party vendor registration portal, with EPCOR
  stating Green Button Alliance certification but publishing no base URI, no
  ESPI version and no technical contract. The second is accidental and entirely
  open: a public ArcGIS Online organization (owner epcor_outages) whose 36
  production feature services - Edmonton power outage areas, Canadian water main
  breaks, water infrastructure projects, scheduled field events, and the outage
  and service-area layers for fourteen EPCOR Water USA districts in Arizona and
  New Mexico - answer anonymous ArcGIS REST queries with live data. EPCOR
  documents none of it, licenses none of it and announces none of it. The result
  is a utility that is open where a province compelled it, open where nobody
  noticed, and closed everywhere it would count as a product; wholesale market
  and system data still comes from AESO and IESO, not from EPCOR.
