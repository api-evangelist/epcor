apis:
- aid: epcor:epcor-ontario-green-button
  name: EPCOR Ontario Green Button (Download My Data / Connect My Data)
  description: >-
    The Green Button energy-data service EPCOR operates for its three Ontario service areas (Aylmer-area
    natural gas, Collingwood-area and Kincardine-area electricity) to satisfy Ontario's O. Reg. 633/21.
    Download My Data lets an authenticated EPCOR customer download usage and billing data in an industry-standard
    XML format from the Green Button portal; Connect My Data ("Data Shares") lets a customer authorize
    a registered third-party vendor to receive energy usage data, billing data and/or account information
    on an ongoing basis via security tokens, with revocation from the portal's Data Shares tab. EPCOR
    states it has been certified by the Green Button Alliance. EPCOR publishes no technical documentation,
    no base URI, no ESPI/NAESB version reference and no machine-readable contract for this interface -
    a third party must apply through the vendor onboarding portal, and the customer-facing portal redirects
    every path to a login, so no endpoint could be verified anonymously. Not offered in EPCOR's Alberta
    or US service areas.
  humanURL: https://www.epcor.com/ca/en/on/collingwood-area/account/manage-account/green-button.html
